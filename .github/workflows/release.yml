name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the tag, version and changelog agree
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          version=$(sed -nE 's/^project\([A-Za-z]+ VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match the CMake version $version"; exit 1
          fi
          if ! grep -qx "## $GITHUB_REF_NAME" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## $GITHUB_REF_NAME' section"; exit 1
          fi

      - name: Check out Lucky Labs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tomdmaguire/lucky-labs
          ref: v1.0.0
          path: lucky-labs
          persist-credentials: false

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLUCKY_LABS_DIR="$GITHUB_WORKSPACE/lucky-labs"

      - name: Build plugins and tests
        run: cmake --build build --target LuckyReference_VST3 LuckyReference_AU LuckyReferenceTests LuckyReferenceProcessorTests

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Validate the Audio Unit
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "build/LuckyReference_artefacts/Release/AU/Lucky Reference.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -v aufx Lref Lcky

      - name: Package
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          [[ "$version" == v* ]] || version="v0.0.0-test"
          artefacts="build/LuckyReference_artefacts/Release"
          package="Lucky-Reference-$version-macOS"
          mkdir -p "dist/$package"
          cp -R "$artefacts/VST3/Lucky Reference.vst3" "dist/$package/"
          cp -R "$artefacts/AU/Lucky Reference.component" "dist/$package/"
          for bundle in "dist/$package/Lucky Reference.vst3" "dist/$package/Lucky Reference.component"; do
            mkdir -p "$bundle/Contents/Resources"
            cp LICENSE "$bundle/Contents/Resources/LICENSE.txt"
            cp lucky-labs/Resources/THIRD-PARTY-NOTICES.txt "$bundle/Contents/Resources/THIRD-PARTY-NOTICES.txt"
          done
          codesign --force --deep --sign - "dist/$package/Lucky Reference.vst3"
          codesign --force --deep --sign - "dist/$package/Lucky Reference.component"
          cp README.md CHANGELOG.md LICENSE "dist/$package/"
          cp lucky-labs/Resources/THIRD-PARTY-NOTICES.txt "dist/$package/THIRD-PARTY-NOTICES.txt"
          cp lucky-labs/Resources/Fonts/OFL.txt "dist/$package/Barlow-OFL.txt"
          cp packaging/INSTALL.txt "dist/$package/INSTALL.txt"
          (cd dist && ditto -c -k --keepParent "$package" "$package.zip")
          packaging/build-pkg.sh "${version#v}" "dist/$package/Lucky Reference.vst3" "dist/$package/Lucky Reference.component" "dist/Lucky-Reference.pkg"
          awk -v heading="## $version" '$0 == heading { found = 1; next } /^## / { found = 0 } found' CHANGELOG.md > dist/notes.md

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: |
            dist/Lucky-Reference.pkg
            dist/Lucky-Reference-*-macOS.zip
            dist/notes.md
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "dist/Lucky-Reference.pkg" "dist/Lucky-Reference-$GITHUB_REF_NAME-macOS.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Lucky Reference $GITHUB_REF_NAME" \
            --notes-file dist/notes.md
